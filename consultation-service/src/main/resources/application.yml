server:
  port: 8083

spring:
  application:
    name: consultation-service
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/psy_consultation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

service:
  notification-url: http://localhost:8085
  user-url: http://localhost:8081
  statistics-url: http://localhost:8084
  appointment-url: http://localhost:8082

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /doc.html
